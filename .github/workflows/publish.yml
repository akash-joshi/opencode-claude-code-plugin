name: Publish
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      # npm@latest changes under us; record which one published this release.
      - name: Show toolchain
        run: node --version && npm --version
      - run: npm install
      - run: npm run build
      - name: Publish package
        run: npm publish --access public
      # The version document can exist while the package record installers
      # read never lists it (every release from 0.25.0 on, 2026-09-23). A
      # warning, not a failure: the publish itself succeeded. Read the record
      # itself rather than asking `npm view`: npm 12.1.0 in CI resolved 0.27.0
      # while the record older clients and opencode's installer read did not
      # list it, so `npm view` passed on exactly the failure this looks for.
      - name: Check the registry lists this version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          listed() {
            curl -fsS -H 'Cache-Control: no-cache' "https://registry.npmjs.org/$name" |
              node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{process.exit((JSON.parse(s).versions||{})[process.argv[1]]?0:1)})' "$version"
          }
          for attempt in $(seq 1 30); do
            if listed; then
              echo "listed: $name@$version"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::npm still does not list $name@$version after 10 minutes, so installing by name gets an older version. The publish succeeded; see AGENTS.md, Release Workflow."
